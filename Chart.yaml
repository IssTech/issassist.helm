apiVersion: v2
name: issassist
description: Backups administration made easier.
icon: https://avatars.githubusercontent.com/u/42239009
home: https://isstech.io/
maintainers:
  - name: Christian Petersson
    email: christian.petersson@isstech.io
  - name: Mazen Mardini
    email: mazen.mardini@isstech.io
type: application

# This is the chart version. This version number should be incremented each
# time you make changes to the chart and its templates,
# including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.5.0

# This is the version number of the application being deployed. This version
# number should be incremented each time you make changes to the application.
# Versions are not expected to follow Semantic Versioning.
# They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.5.0"

# Both subcharts are vendored under charts/ and have no repository: Helm uses the
# copy that is there, so `helm dependency build` downloads nothing.
dependencies:
  # Always installed, exactly as before this entry existed: there is no
  # `kubernetes-secret-generator.enabled` key and no condition. Every password and
  # key Secret in templates/accounts/ and templates/issassist/ depends on it.
  # Listing it is what `helm lint` asks for (#366, IA-0046).
  - name: kubernetes-secret-generator
    version: 3.4.2  # IA-0046 deliberate break: helm dependency build must go red
  - name: superset
    version: 0.15.2
    condition: superset.enabled
