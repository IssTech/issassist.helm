{{/*
Kasten (IA-0026 slice 2, isstech-issues#493): K10's namespace, where the API reads
K10's own pod logs for the support .zip. values.yaml
`kastenConnector.podLogs.namespace` -> this ConfigMap -> `envFrom` on the API ->
IA_KASTEN_POD_LOGS_NAMESPACE -> `issassist.kasten.pod_logs.pod_logs_namespace`.

Rendered whatever `kastenConnector.enabled` says: the connector is applied to each
monitored cluster on its own, and the API needs the namespace for all of them.
Read through `default dict` for `--reuse-values` from a release that never had the
key. A value that is not a namespace name fails the render, and the API refuses it
too (fail closed) rather than falling back to kasten-io.

Restore tests (IA-0050 #539, IA-0051 #540): `kastenConnector.restoreTests.*` and
`kastenConnector.yara.*` -> IA_KASTEN_RT_* / IA_KASTEN_YARA_* ->
`issassist.kasten.restore_tests.settings`. Only an explicit true switches either on.
IA_KASTEN_RT_KASTEN_NAMESPACE is K10's namespace again (`restoreTests.kastenNamespace`,
else `podLogs.namespace`): the API checks there that the restore-test key can NOT
create TransformSets, which Kasten 9 requires before it applies any transform.
*/}}
{{- if .Values.api.enabled }}
{{- $kc := .Values.kastenConnector | default dict }}
{{- $podLogs := $kc.podLogs | default dict }}
{{- $ns := $podLogs.namespace | default "kasten-io" | toString }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" $ns) }}
{{- fail "kastenConnector.podLogs.namespace must be a Kubernetes namespace name, such as kasten-io" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: issassist-kasten
data:
  IA_KASTEN_POD_LOGS_NAMESPACE: {{ $ns | quote }}
  {{- $rt := $kc.restoreTests | default dict }}
  {{- $yara := $kc.yara | default dict }}
  IA_KASTEN_RT_ENABLED: {{ eq (toString $rt.enabled) "true" | ternary "true" "false" | quote }}
  IA_KASTEN_RT_NAMESPACE: {{ $rt.namespace | default "issassist-restore-test" | toString | quote }}
  IA_KASTEN_RT_IMAGE: {{ $rt.image | default "" | toString | quote }}
  IA_KASTEN_RT_TIMEOUT_MINUTES: {{ $rt.timeoutMinutes | default 60 | toString | quote }}
  IA_KASTEN_RT_KEEP_MAX_HOURS: {{ (hasKey $rt "keepOnFailureMaxHours") | ternary (toString $rt.keepOnFailureMaxHours) "72" | quote }}
  IA_KASTEN_RT_MAX_REPLICAS: {{ $rt.maxReplicas | default 1 | toString | quote }}
  {{- $k10 := $rt.kastenNamespace | default $ns | toString }}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" $k10) }}
  {{- fail "kastenConnector.restoreTests.kastenNamespace must be a Kubernetes namespace name, such as kasten-io" }}
  {{- end }}
  IA_KASTEN_RT_KASTEN_NAMESPACE: {{ $k10 | quote }}
  IA_KASTEN_YARA_ENABLED: {{ eq (toString $yara.enabled) "true" | ternary "true" "false" | quote }}
  IA_KASTEN_YARA_MAX_FILE_MIB: {{ $yara.maxFileSizeMiB | default 256 | toString | quote }}
{{- end }}
