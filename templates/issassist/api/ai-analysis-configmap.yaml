{{/*
AI analysis (#463): what this site allows, from `aiAnalysis.*` and
`global.darkSite`. values.yaml -> this ConfigMap -> `envFrom` on the API ->
`issassist.ai_analysis.site`. Keys are not here: they come from the Secrets the
values name, through `secretKeyRef` in the API Deployment.

Every switch fails closed:
* IA_DARK_SITE renders "false" only for a literal `darkSite: false`. Missing,
  null, or anything else is dark (security review of #463, 2026/11/02).
* IA_AI_<ID>_ALLOWED renders "true" only for `allowed: true`.
* IA_AI_DEBUG_WIZARD renders "true" only for `debugWizard.enabled: true`. The
  wizard shows real names next to their stand-ins, so it is for a test
  installation (staging). Only Helm, or kubectl editing this ConfigMap, sets it;
  a kubectl edit lasts until the next `helm upgrade`.

Read through `default dict`: `--reuse-values` rebases on the previous release's
values, where these keys did not exist yet.
*/}}
{{- if .Values.api.enabled }}
{{- $global := .Values.global | default dict }}
{{- $ai := .Values.aiAnalysis | default dict }}
{{- $providers := $ai.providers | default dict }}
{{- $dark := true }}
{{- if and (hasKey $global "darkSite") (eq (toString $global.darkSite) "false") }}{{ $dark = false }}{{ end }}
{{- /* Not `default 20`: Sprig's default treats 0 as empty, and a ceiling of 0 is a choice. */}}
{{- $cap := 20 }}
{{- if and (hasKey $ai "maxDailyCapEur") (not (kindIs "invalid" $ai.maxDailyCapEur)) }}{{ $cap = $ai.maxDailyCapEur }}{{ end }}
{{- $concurrent := 2 }}
{{- if and (hasKey $ai "maxConcurrent") (not (kindIs "invalid" $ai.maxConcurrent)) }}{{ $concurrent = $ai.maxConcurrent }}{{ end }}
{{- $wizard := $ai.debugWizard | default dict }}
{{- $training := $ai.training | default dict }}
{{- $local := $providers.local | default dict }}
{{- $endpoint := $local.endpoint | default "" }}
{{- /* The value is never printed: a URL with credentials in it must not end up in CI logs. */}}
{{- if and $endpoint (not (hasPrefix "https://" $endpoint)) }}
{{- fail "aiAnalysis.providers.local.endpoint must start with https://: only encrypted connections are allowed" }}
{{- end }}
{{- if and $endpoint (contains "?" $endpoint) }}
{{- fail "aiAnalysis.providers.local.endpoint must not carry a query string; put a token in local.existingSecret" }}
{{- end }}
{{- if and $endpoint (contains "@" (index (splitList "/" (trimPrefix "https://" $endpoint)) 0)) }}
{{- fail "aiAnalysis.providers.local.endpoint must not carry credentials (user:password@); put a token in local.existingSecret" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: issassist-ai-analysis
data:
  IA_DARK_SITE: {{ ternary "true" "false" $dark | quote }}
  IA_AI_MAX_DAILY_CAP_EUR: {{ $cap | toString | quote }}
  IA_AI_MAX_CONCURRENT: {{ $concurrent | toString | quote }}
  IA_AI_DEBUG_WIZARD: {{ ternary "true" "false" (eq (toString $wizard.enabled) "true") | quote }}
  # Training feed to IssTech (IA-0031). Fails closed: only an explicit `true` renders
  # "true"; missing (an upgrade from an older release), false, yes or a typo is "false".
  IA_TRAINING_ALLOWED: {{ ternary "true" "false" (eq (toString $training.allowed) "true") | quote }}
  {{- $capDefaults := dict "claude" (list 5 20) "gemini" (list 5 20) "bob" (list 20 50) }}
  {{- range $id := list "local" "claude" "gemini" "bob" "copilot" }}
  {{- $p := get $providers $id | default dict }}
  IA_AI_{{ upper $id }}_ALLOWED: {{ ternary "true" "false" (eq (toString $p.allowed) "true") | quote }}
  {{- $secret := include "issassist.aiKeySecretName" (dict "id" $id "p" $p) }}
  {{- if $secret }}
  IA_AI_{{ upper $id }}_SECRET_NAME: {{ $secret | quote }}
  {{- end }}
  {{- /* The cap per provider (mockup §8). The fallback is values.yaml's own default,
         for a release upgraded with --reuse-values from before these keys existed;
         not `default`, which reads 0 as unset. */}}
  {{- $fallback := get $capDefaults $id | default (list 0 0) }}
  IA_AI_{{ upper $id }}_DAILY_CAP: {{ ternary $p.dailyCap (index $fallback 0) (and (hasKey $p "dailyCap") (not (kindIs "invalid" $p.dailyCap))) | toString | quote }}
  IA_AI_{{ upper $id }}_DAILY_CAP_MAX: {{ ternary $p.dailyCapMax (index $fallback 1) (and (hasKey $p "dailyCapMax") (not (kindIs "invalid" $p.dailyCapMax))) | toString | quote }}
  {{- end }}
  IA_AI_LOCAL_ENDPOINT: {{ $endpoint | quote }}
  IA_AI_LOCAL_MODEL: {{ $local.model | default "" | quote }}
  {{- /* The model's context window in tokens (2026/11/27). Ollama cuts a longer prompt
         silently, so the API refuses or shortens the answer rather than send one. Not
         `default`: an older release (--reuse-values) without the key gets 4096. */}}
  {{- $ctx := 4096 }}
  {{- if and (hasKey $local "contextTokens") (not (kindIs "invalid" $local.contextTokens)) }}{{ $ctx = $local.contextTokens }}{{ end }}
  {{- $ctx = trim (toString $ctx) }}
  {{- if not (regexMatch "^[1-9][0-9]{0,6}$" $ctx) }}
  {{- fail "aiAnalysis.providers.local.contextTokens: a whole number of tokens from 1 to 9999999" }}
  {{- end }}
  IA_AI_LOCAL_CONTEXT_TOKENS: {{ $ctx | quote }}
  {{- /* The site's price for an endpoint outside this cluster. Empty or unreadable is
         read as 0 by the API, which then refuses such an endpoint (fails closed). */}}
  IA_AI_LOCAL_PRICE_IN: {{ $local.priceInEurPerMtok | default "" | toString | quote }}
  IA_AI_LOCAL_PRICE_OUT: {{ $local.priceOutEurPerMtok | default "" | toString | quote }}
  {{- /* Own infrastructure (2026/11/27, a first test for 2026/12/04): only a literal
         `true` renders "true", and only with clientTls set. */}}
  {{- $own := eq (toString $local.ownInfrastructure) "true" }}
  {{- if and $own (not (include "issassist.llmClientTls" . | fromJson).secretName) }}
  {{- fail "aiAnalysis.providers.local.ownInfrastructure needs aiAnalysis.providers.local.clientTls (secretName, caConfigMap, caKey)" }}
  {{- end }}
  {{- /* Own infrastructure is priced and capped like any endpoint outside this cluster
         (owner decision D5 = C, 2026/11/27): without a price the API would refuse it,
         and without a cap the GPU's own budget would be the first to say no. */}}
  {{- $ownUntil := "" }}
  {{- if $own }}
  {{- $pin := trim (toString ($local.priceInEurPerMtok | default "")) }}
  {{- $pout := trim (toString ($local.priceOutEurPerMtok | default "")) }}
  {{- if not (and (regexMatch "^[0-9]+(\\.[0-9]+)?$" $pin) (regexMatch "^[0-9]+(\\.[0-9]+)?$" $pout) (gt (float64 $pin) 0.0) (gt (float64 $pout) 0.0)) }}
  {{- fail "aiAnalysis.providers.local.ownInfrastructure is priced and capped like any endpoint outside this cluster: set priceInEurPerMtok and priceOutEurPerMtok above 0" }}
  {{- end }}
  {{- if not (and (gt (float64 ($local.dailyCap | default 0)) 0.0) (gt (float64 ($local.dailyCapMax | default 0)) 0.0)) }}
  {{- fail "aiAnalysis.providers.local.ownInfrastructure is priced and capped like any endpoint outside this cluster: set dailyCap and dailyCapMax above 0 (EUR)" }}
  {{- end }}
  {{- /* And it ends on a date (owner decision D2 = B, 2026/11/27): YYYY/MM/DD, today
         (UTC) at the earliest and at most 92 days ahead. A date that does not exist
         (2026/02/30) is refused, never rolled over. No automatic renewal: a person sets
         a new date after reviewing it. The round trip that refuses 2026/02/30 parses and
         formats in the same (local) zone: mixing in UTC shifted every date by a day east
         of UTC (security review 2026/11/27). */}}
  {{- $today := dateInZone "2006/01/02" now "UTC" }}
  {{- $latest := dateInZone "2006/01/02" (dateModify "+2208h" now) "UTC" }}
  {{- $v := trim (toString ($local.ownInfrastructureUntil | default "")) }}
  {{- if not $v }}
  {{- fail (printf "aiAnalysis.providers.local.ownInfrastructureUntil is required with ownInfrastructure: true: own infrastructure is a staging test. Set the date it ends (YYYY/MM/DD, at most %s)." $latest) }}
  {{- end }}
  {{- if or (not (regexMatch "^[0-9]{4}/[0-9]{2}/[0-9]{2}$" $v)) (ne (date "2006/01/02" (toDate "2006/01/02" $v)) $v) }}
  {{- fail (printf "aiAnalysis.providers.local.ownInfrastructureUntil (%s) is not a date: write it YYYY/MM/DD, a day that exists, at most %s." $v $latest) }}
  {{- end }}
  {{- if lt $v $today }}
  {{- fail (printf "aiAnalysis.providers.local.ownInfrastructureUntil (%s) has passed: own infrastructure was a staging test. Remove ownInfrastructure, or set a new date (at most %s) after reviewing it." $v $latest) }}
  {{- end }}
  {{- if gt $v $latest }}
  {{- fail (printf "aiAnalysis.providers.local.ownInfrastructureUntil (%s) is more than 92 days ahead: set a date no later than %s." $v $latest) }}
  {{- end }}
  {{- $ownUntil = replace "/" "-" $v }}
  {{- end }}
  IA_AI_LOCAL_OWN_INFRASTRUCTURE: {{ ternary "true" "false" $own | quote }}
  {{- /* ISO on the wire; empty when own infrastructure is off. */}}
  IA_AI_LOCAL_OWN_INFRASTRUCTURE_UNTIL: {{ $ownUntil | quote }}
  {{- /* IBM Bob's run pods (slice 4). `default` is not used for numbers: Sprig treats
         0 as empty, and a limit of 0 is a choice. */}}
  {{- $bob := $providers.bob | default dict }}
  IA_AI_BOB_NAMESPACE: {{ $bob.namespace | default "ai-bob-runs" | quote }}
  IA_AI_BOB_IMAGE: {{ $bob.image | default "" | quote }}
  IA_AI_BOB_KEYPROXY_IMAGE: {{ $bob.keyproxyImage | default "" | quote }}
  {{- $gw := include "issassist.bobGateways" $bob | fromJson }}
  {{- /* The regions the web GUI offers, the default, and a customer's own fixed address. */}}
  IA_AI_BOB_REGIONS: {{ $gw.regions | toJson | quote }}
  IA_AI_BOB_REGION: {{ $gw.region | quote }}
  IA_AI_BOB_GATEWAY_URL: {{ $gw.fixed | quote }}
  IA_AI_BOB_PULL_SECRET: {{ include "issassist.bobPullSecret" . | quote }}
  IA_AI_BOB_TIMEOUT_SECONDS: {{ ternary $bob.timeoutSeconds 180 (hasKey $bob "timeoutSeconds") | toString | quote }}
  IA_AI_BOB_MAX_TURNS: {{ ternary $bob.maxTurns 3 (hasKey $bob "maxTurns") | toString | quote }}
  IA_AI_BOB_MAX_COST_PER_RUN_BOBCOINS: {{ ternary $bob.maxCostPerRunBobcoins 5 (hasKey $bob "maxCostPerRunBobcoins") | toString | quote }}
{{- end }}
