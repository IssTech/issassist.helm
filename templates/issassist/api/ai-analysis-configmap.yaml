{{/*
AI analysis (#463): what this site allows, from `aiAnalysis.*` and
`global.darkSite`. values.yaml -> this ConfigMap -> `envFrom` on the API ->
`issassist.ai_analysis.site`. Keys are not here: they come from the Secrets the
values name, through `secretKeyRef` in the API Deployment.

Every switch fails closed:
* IA_DARK_SITE renders "false" only for a literal `darkSite: false`. Missing,
  null, or anything else is dark (security review of #463, 2026/11/02).
* IA_AI_<ID>_ALLOWED renders "true" only for `allowed: true`.
* IA_AI_DEBUG_WIZARD renders "true" only for `debugWizard.enabled: true`. The
  wizard shows real names next to their stand-ins, so it is for a test
  installation (staging). Only Helm, or kubectl editing this ConfigMap, sets it;
  a kubectl edit lasts until the next `helm upgrade`.

Read through `default dict`: `--reuse-values` rebases on the previous release's
values, where these keys did not exist yet.
*/}}
{{- if .Values.api.enabled }}
{{- $global := .Values.global | default dict }}
{{- $ai := .Values.aiAnalysis | default dict }}
{{- $providers := $ai.providers | default dict }}
{{- $dark := true }}
{{- if and (hasKey $global "darkSite") (eq (toString $global.darkSite) "false") }}{{ $dark = false }}{{ end }}
{{- /* Not `default 20`: Sprig's default treats 0 as empty, and a ceiling of 0 is a choice. */}}
{{- $cap := 20 }}
{{- if and (hasKey $ai "maxDailyCapEur") (not (kindIs "invalid" $ai.maxDailyCapEur)) }}{{ $cap = $ai.maxDailyCapEur }}{{ end }}
{{- $concurrent := 2 }}
{{- if and (hasKey $ai "maxConcurrent") (not (kindIs "invalid" $ai.maxConcurrent)) }}{{ $concurrent = $ai.maxConcurrent }}{{ end }}
{{- $wizard := $ai.debugWizard | default dict }}
{{- $local := $providers.local | default dict }}
{{- $endpoint := $local.endpoint | default "" }}
{{- /* The value is never printed: a URL with credentials in it must not end up in CI logs. */}}
{{- if and $endpoint (not (hasPrefix "https://" $endpoint)) }}
{{- fail "aiAnalysis.providers.local.endpoint must start with https://: only encrypted connections are allowed" }}
{{- end }}
{{- if and $endpoint (contains "?" $endpoint) }}
{{- fail "aiAnalysis.providers.local.endpoint must not carry a query string; put a token in local.existingSecret" }}
{{- end }}
{{- if and $endpoint (contains "@" (index (splitList "/" (trimPrefix "https://" $endpoint)) 0)) }}
{{- fail "aiAnalysis.providers.local.endpoint must not carry credentials (user:password@); put a token in local.existingSecret" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: issassist-ai-analysis
data:
  IA_DARK_SITE: {{ ternary "true" "false" $dark | quote }}
  IA_AI_MAX_DAILY_CAP_EUR: {{ $cap | toString | quote }}
  IA_AI_MAX_CONCURRENT: {{ $concurrent | toString | quote }}
  IA_AI_DEBUG_WIZARD: {{ ternary "true" "false" (eq (toString $wizard.enabled) "true") | quote }}
  {{- $capDefaults := dict "claude" (list 5 20) "gemini" (list 5 20) "bob" (list 20 50) }}
  {{- range $id := list "local" "claude" "gemini" "bob" "isstech" "copilot" }}
  {{- $p := get $providers $id | default dict }}
  IA_AI_{{ upper $id }}_ALLOWED: {{ ternary "true" "false" (eq (toString $p.allowed) "true") | quote }}
  {{- $secret := include "issassist.aiKeySecretName" (dict "id" $id "p" $p) }}
  {{- if $secret }}
  IA_AI_{{ upper $id }}_SECRET_NAME: {{ $secret | quote }}
  {{- end }}
  {{- /* The cap per provider (mockup §8). The fallback is values.yaml's own default,
         for a release upgraded with --reuse-values from before these keys existed;
         not `default`, which reads 0 as unset. */}}
  {{- $fallback := get $capDefaults $id | default (list 0 0) }}
  IA_AI_{{ upper $id }}_DAILY_CAP: {{ ternary $p.dailyCap (index $fallback 0) (and (hasKey $p "dailyCap") (not (kindIs "invalid" $p.dailyCap))) | toString | quote }}
  IA_AI_{{ upper $id }}_DAILY_CAP_MAX: {{ ternary $p.dailyCapMax (index $fallback 1) (and (hasKey $p "dailyCapMax") (not (kindIs "invalid" $p.dailyCapMax))) | toString | quote }}
  {{- end }}
  IA_AI_LOCAL_ENDPOINT: {{ $endpoint | quote }}
  IA_AI_LOCAL_MODEL: {{ $local.model | default "" | quote }}
  {{- /* IBM Bob's run pods (slice 4). `default` is not used for numbers: Sprig treats
         0 as empty, and a limit of 0 is a choice. */}}
  {{- $bob := $providers.bob | default dict }}
  IA_AI_BOB_NAMESPACE: {{ $bob.namespace | default "ai-bob-runs" | quote }}
  IA_AI_BOB_IMAGE: {{ $bob.image | default "" | quote }}
  IA_AI_BOB_KEYPROXY_IMAGE: {{ $bob.keyproxyImage | default "" | quote }}
  IA_AI_BOB_GATEWAY_URL: {{ $bob.gatewayUrl | default "https://api.us-east.bob.ibm.com" | quote }}
  IA_AI_BOB_REGION: {{ $bob.region | default "" | quote }}
  IA_AI_BOB_TIMEOUT_SECONDS: {{ ternary $bob.timeoutSeconds 180 (hasKey $bob "timeoutSeconds") | toString | quote }}
  IA_AI_BOB_MAX_TURNS: {{ ternary $bob.maxTurns 3 (hasKey $bob "maxTurns") | toString | quote }}
  IA_AI_BOB_MAX_COST_PER_RUN_BOBCOINS: {{ ternary $bob.maxCostPerRunBobcoins 5 (hasKey $bob "maxCostPerRunBobcoins") | toString | quote }}
{{- end }}
