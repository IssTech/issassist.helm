apiVersion: v1
kind: Secret
metadata:
  name: api-jwt-secret-key
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "jwt-secret-key"
    secret-generator.v1.mittwald.de/length: "64"
---
# Encrypts the AvePoint partner client secret at rest. Generated here so an operator
# never has to produce one, and never has a reason to leave the credential in the
# clear -- the API refuses to store a partner credential without this key.
#
# Deliberately its own key rather than a reuse of api-jwt-secret-key. Sharing one
# would mean rotating either breaks the other, which in practice means neither is
# ever rotated. Rotating this one costs re-entering the AvePoint client secret.
apiVersion: v1
kind: Secret
metadata:
  name: api-avepoint-secret-key
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "avepoint-secret-key"
    secret-generator.v1.mittwald.de/length: "64"
---
# Derives the per-customer reference sent to the IssTech dashboard when licence
# reporting is anonymised. Never transmitted: IssTech holds no copy, so a reference
# cannot be reversed there, while this installation can always map one back.
#
# Its own secret rather than a reuse of the others. Rotating this renames every
# customer on the dashboard and breaks its history, so it must not rotate as a side
# effect of rotating a key that protects something else.
apiVersion: v1
kind: Secret
metadata:
  name: api-reporting-salt
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "reporting-salt"
    secret-generator.v1.mittwald.de/length: "64"
---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-auth
stringData:
  username: {{ .Values.global.mail.smtpUsername | quote }}
  password: {{ .Values.global.mail.smtpPassword | quote }}
