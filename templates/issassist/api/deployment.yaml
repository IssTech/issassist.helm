{{ if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      annotations:
        # Restart on a change to logging.*: env is read once, at start.
        checksum/logging: {{ include (print $.Template.BasePath "/issassist/logging-configmap.yaml") . | sha256sum }}
        # Restart on a change to aiAnalysis.* / global.darkSite: env is read once, at start.
        checksum/ai-analysis: {{ include (print $.Template.BasePath "/issassist/api/ai-analysis-configmap.yaml") . | sha256sum }}
        # Restart on a change to api.avepoint.allowedHosts: env is read once, at start.
        checksum/avepoint: {{ include (print $.Template.BasePath "/issassist/api/avepoint-configmap.yaml") . | sha256sum }}
      labels:
       app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      imagePullSecrets:
        - name: {{ include "issassist.imagePullSecretName" . }}

      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command:
            - "/bin/bash"
          args:
            - "-c"
            - |
              mkdir /app/data/cert
              cp /mnt/certs/tls.key /app/data/cert/api.key && \
              cp /mnt/certs/tls.crt /app/data/cert/api.crt && \
              cp /mnt/issassist-ca.crt /app/data/cert/issassist-ca.crt && \
              chown -R issassist:issassist /app/data/cert && \
              chmod 755 -R /app/data/cert && \
              chmod 600 /app/data/cert/api.key && \
              /entrypoint.sh
          # The first start runs every database migration, which can take
          # minutes. Without a startup probe the liveness probe killed the API
          # mid-migration after 30 s, and each restart began again and threw
          # away the only log of why. Liveness only starts once this succeeds:
          # up to 10 minutes (60 x 10 s).
          startupProbe:
            httpGet:
              port: 8000
              path: "{{ .Values.global.basePath }}/api/v1/info/"
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              port: 8000
              path: "{{ .Values.global.basePath }}/api/v1/info/"
            initialDelaySeconds: 30
            timeoutSeconds: 60
          envFrom:
            # IA_LOG_LEVEL, IA_LOG_FORMAT, IA_LOG_KEEP_DAYS, IA_LOG_STORE_FROM
            - configMapRef:
                name: issassist-logging
            # IA_DARK_SITE, IA_AI_*: what AI analysis may use (#463)
            - configMapRef:
                name: issassist-ai-analysis
            # IA_AVEPOINT_ALLOWED_HOSTS: where the AvePoint credential may go (#437)
            - configMapRef:
                name: issassist-avepoint
          env:
            # Every log line names the pod and node it came from: replicas run
            # on different nodes, and a network fault is often only one of them.
            - name: IA_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IA_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IA_ROOT_PATH
              value: "{{ .Values.global.basePath }}/api"
            # The proxies whose X-Forwarded-* headers are trusted (IA-0036, security
            # review H1). Empty (the default) trusts none: the API sees the proxy's own
            # address, as it always effectively did. Never "*": that trusts a header the
            # client writes. A non-list value or "*" stops the render.
            {{- $fwd := (.Values.api | default dict).forwardedAllowIps | default "" | toString | trim }}
            {{- if or (eq $fwd "*") (contains "*" $fwd) }}
            {{- fail "api.forwardedAllowIps must list the ingress controller's addresses or CIDRs, never \"*\"" }}
            {{- end }}
            {{- /* Each entry an IPv4 or IPv6 address or CIDR; never an empty entry and never a
                 /0, which trusts every address like "*" (re-review 1). */}}
            {{- $v4 := "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}(/([1-9]|[12][0-9]|3[0-2]))?$" }}
            {{- $v6 := "^([0-9A-Fa-f]{1,4}:){1,7}(:|:?[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,6}|:)?(/([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))?$" }}
            {{- if $fwd }}
            {{- range $entry := splitList "," (replace " " "" $fwd) }}
            {{- if not (or (regexMatch $v4 $entry) (and (contains ":" $entry) (regexMatch $v6 $entry))) }}
            {{- fail "api.forwardedAllowIps must be a comma-separated list of IP addresses or CIDRs (no /0)" }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: IA_FORWARDED_ALLOW_IPS
              value: {{ replace " " "" $fwd | quote }}
            # Whether logs may be sent to IssTech support at all. The administrator's
            # switch under Reporting decides whether they are; this only removes the
            # possibility.
            - name: IA_SUPPORT_SEND
              # Fails closed: only `true` (or leaving the key out, for an upgrade
              # from a chart without it) renders "true". "False", "off" or a typo
              # renders "false".
              {{- $send := (.Values.support | default dict).send }}
              value: {{ ternary "true" "false" (or (kindIs "invalid" $send) (eq ($send | toString) "true")) | quote }}
            # Whether IssAssist Preview (the 2.0 features) may be turned on at all.
            # The operator's switch under Settings → IssAssist decides whether it is.
            - name: IA_PREVIEW_ALLOWED
              # Fails closed: only `allowed: true`, or leaving the key out for an
              # upgrade from a chart without it, renders "true". `preview: false`
              # (the shorthand, not a map) renders "false". Reading `.allowed`
              # through `default dict` would have turned `false` into an empty map
              # and rendered "true" (security review 2026/10/29).
              {{- $previewBlock := (.Values.global | default dict).preview }}
              {{- $previewOk := kindIs "invalid" $previewBlock }}
              {{- if kindIs "map" $previewBlock }}
              {{- $allowed := $previewBlock.allowed }}
              {{- $previewOk = or (kindIs "invalid" $allowed) (eq ($allowed | toString) "true") }}
              {{- end }}
              value: {{ ternary "true" "false" $previewOk | quote }}
{{- if .Values.api.issTechConnect.url }}
            # Connection to IssTech's dashboard. Absent entirely when no URL is
            # configured, so the application never registers the reporting job.
            - name: IA_DASHBOARD_URL
              value: {{ .Values.api.issTechConnect.url | quote }}
            - name: IA_DASHBOARD_ACTIVATION_CODE
              valueFrom:
                secretKeyRef:
                  name: api-isstech-connect
                  key: "activation-code"
            # Encrypts the enrolment credential at rest. Generated once and kept
            # across upgrades; rotating it forces re-enrolment.
            - name: IA_DASHBOARD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-isstech-connect
                  key: "secret-key"
{{- if .Values.api.issTechConnect.caCertPath }}
            # Dark Site behind a TLS-inspecting proxy. Verification stays on; the
            # proxy's CA is trusted instead.
            - name: IA_DASHBOARD_CA_CERT_PATH
              value: {{ .Values.api.issTechConnect.caCertPath | quote }}
{{- end }}
{{- end }}
            - name: IA_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-postgres-auth
                  key: "username"
            - name: IA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-postgres-auth
                  key: "password"
            - name: IA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-valkey-auth
                  key: "username"
            - name: IA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-valkey-auth
                  key: "password"
            - name: IA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: "username"
            - name: IA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: "password"
            - name: IA_ADMIN_EMAIL
              value: {{ .Values.global.adminAccount.email | quote }}
            - name: IA_ADMIN_TZ
              value: {{ .Values.global.adminAccount.timezone | quote }}
            - name: IA_ADMIN_PASSWORD_IS_LOCKED
              value: {{ .Values.global.adminAccount.lockPassword | quote }}
            - name: IA_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-jwt-secret-key
                  key: "jwt-secret-key"
            - name: IA_AVEPOINT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-avepoint-secret-key
                  key: "avepoint-secret-key"
            - name: IA_REPORTING_SALT
              valueFrom:
                secretKeyRef:
                  name: api-reporting-salt
                  key: "reporting-salt"
            # Encrypts provider keys entered in the web GUI (#463 slice 1b).
            - name: IA_AI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ai-secret-key
                  key: "ai-secret-key"
            # AI provider keys (#463) set through Helm: the Secret the operator names
            # (existingSecret), or the one the chart renders from apiKey (slice 1b).
            # Optional, so the pod starts without one; the key can then be entered in
            # the web GUI instead. A key here always wins over the web GUI's.
            # Never Bob's: Bob runs in its own pod per run, and the API pod must
            # never hold the Bob key (decided 2026/11/01).
            {{- /* A fixed list, as in the ConfigMap: a key under any other name (BOB,
                   evil) is ignored, and bob is not on it. */}}
            {{- $aiProviders := (.Values.aiAnalysis | default dict).providers | default dict }}
            {{- range $id := list "local" "claude" "gemini" "copilot" }}
            {{- $p := get $aiProviders $id }}
            {{- $secret := include "issassist.aiKeySecretName" (dict "id" $id "p" $p) }}
            {{- if $secret }}
            - name: IA_AI_{{ upper $id }}_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: "api-key"
                  optional: true
            {{- end }}
            {{- end }}
            {{if .Values.global.mail.smtpHost }}
            - name: IA_SMTP_HOST
              value: {{ .Values.global.mail.smtpHost | quote }}
            {{end}}
            {{if .Values.global.mail.smtpPort }}
            - name: IA_SMTP_PORT
              value: {{ .Values.global.mail.smtpPort | quote }}
            {{end}}
            {{if .Values.global.mail.smtpTLS }}
            - name: IA_SMTP_TLS
              value: {{ .Values.global.mail.smtpTLS | quote }}
            {{end}}
            {{if .Values.global.mail.fromEmailAddress }}
            - name: IA_MAIL_FROM_EMAIL_ADDRESS
              value: {{ .Values.global.mail.fromEmailAddress | quote }}
            {{end}}
            {{if .Values.global.mail.fromName }}
            - name: IA_MAIL_FROM_NAME
              value: {{ .Values.global.mail.fromName | quote }}
            {{end}}
            - name: IA_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: "username"
            - name: IA_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: "password"
            - name: IA_CORS_ALLOWED_ORIGINS
              value: '"{{- template "webGUIOrigin" . }}"'
          volumeMounts:
            - name: api-config
              mountPath: "/app/data/config.toml"
              subPath: "config.toml"
            - name: api-cert
              mountPath: "/mnt/certs"
            - name: issassist-ca-cert
              mountPath: "/mnt/issassist-ca.crt"
              subPath: "tls.crt"
      volumes:
        - name: api-config
          configMap:
            name: api-config
        - name: api-cert
          secret:
            secretName: api-cert
        - name: issassist-ca-cert
          secret:
            secretName: issassist-ca-cert
        - name: api-postgres-auth
          secret:
            secretName: api-postgres-auth
        - name: api-valkey-auth
          secret:
            secretName: api-valkey-auth
        - name: admin-auth
          secret:
            secretName: admin-auth
        - name: api-jwt-secret-key
          secret:
            secretName: api-jwt-secret-key
        - name: smtp-auth
          secret:
            secretName: smtp-auth
{{ end }}
