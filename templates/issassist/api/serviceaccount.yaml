{{/*
The API's own ServiceAccount (#463 slice 4). Before, the API ran as the namespace's
`default` account. Its only permissions are the Role in IBM Bob's run namespace
(ai-bob-runs.yaml), and only while Bob is allowed.
*/}}
{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
{{- end }}
