{{- if not .Values.imageCredentials.existingSecret }}
# Built from imageCredentials.username/password.
#
# Not rendered when imageCredentials.existingSecret is set, because then the
# credential lives in a Secret you manage and never passes through Helm values.
apiVersion: v1
kind: Secret
metadata:
  name: isstech-repository-auth
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
