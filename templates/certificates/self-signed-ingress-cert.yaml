# Self-signed ingress certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: self-signed-ingress-cert
spec:
  commonName: {{ .Values.global.publicDomainName }}
  secretName: self-signed-ingress-cert
  duration: {{ .Values.global.certDuration }}
  renewBefore: 360h  # 15 days
  usages:
    - server auth
  dnsNames:
    - {{ .Values.global.publicDomainName }}
  subject:
    organizations:
      - "IssTech AB"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
# There is deliberately no Issuer for this certificate.
#
# One existed — a `ca` Issuer pointing at `self-signed-ingress-cert` — and it
# could never become ready: that secret holds the ingress's own server
# certificate (`usages: server auth`, no `isCA`), and cert-manager refuses a CA
# issuer whose certificate is not a CA:
#
#     Error getting keypair for CA issuer: certificate is not a CA
#
# Nothing ever issued from it; the ingress references the secret directly. Its
# only effect was a permanently NotReady resource in every install, which fails
# `helm upgrade --wait` and hides real failures among the noise. An internal CA
# to issue from already exists: `issassist-ca-issuer` (templates/certificates/issassist-ca.yaml).
