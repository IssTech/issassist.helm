{{- if and .Values.tsmAgent.sync.operationsCenters .Values.tsmAgent.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-all-operations-centers
  labels:
    app.kubernetes.io/name: tsm-agent
spec:
  schedule: {{ .Values.tsmAgent.sync.operationsCenters.crontab | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  timeZone: {{ .Values.global.adminAccount.timezone | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          # Required: the tsmAgent image lives in the private ghcr.io/isstech
          # registry. Without this, the kubelet falls back to an anonymous pull
          # and ghcr.io answers 401, so every scheduled run lands in
          # ImagePullBackOff. The Deployments in this chart all carry the same
          # block; these two CronJobs were the only pod specs missing it.
          imagePullSecrets:
            - name: isstech-repository-auth
          containers:
            - name: sync-all-operations-centers
              image: {{ .Values.tsmAgent.image }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - sync-client operations-centers --host=tsm-agent
          restartPolicy: Never
{{- end }}

---

