          # registry. Without this, the kubelet falls back to an anonymous pull
          # and ghcr.io answers 401, so every scheduled run lands in
          # ImagePullBackOff. The Deployments in this chart all carry the same
          # block; these two CronJobs were the only pod specs missing it.
          imagePullSecrets:
            - name: isstech-repository-auth
          containers:
            - name: sync-all-dedup-stats
